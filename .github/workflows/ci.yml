name: Test check_group.sh Script

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        # Ensure the test script is executable
        chmod +x check_group.sh

    - name: Run test script
      run: |
        chmod +x test_check_group.sh
        ./test_check_group.sh
